name: master #name of the cluster
nodes:
  main:
    capabilities:
      cpu: 7
      ram: 8
      storage: 1024
      availability: 99
      subnet: [public]
      security: [ssl, firewall]
    profile:
      cost: 9
      carbon: 402
  m2:
    capabilities:
      cpu: 7
      ram: 8
      storage: 512
      availability: 98
      subnet: [public]
      security: [ssl, firewall]
    profile:
      cost: 4
      carbon: 200
  worker1:
    capabilities:
      cpu: 7
      ram: 8
      storage: 1024
      availability: 99
      subnet: [private]
      security: [ssl, firewall]
    profile:
      cost: 7
      carbon: 340
  worker2:
    capabilities:
      cpu: 7
      ram: 8
      storage: 1024
      availability: 99
      subnet: [private]
      security: [ssl, firewall, encrypted_storage]
    profile:
      cost: 7
      carbon: 360
  worker3:
    capabilities:
      cpu: 7
      ram: 8
      storage: 1024
      availability: 99
      subnet: [private]
      security: [ssl, firewall, encrypted_storage]
    profile:
      cost: 7
      carbon: 360
links:
  - connected_nodes: [main, worker1]
    capabilities: { latency: 10, availability: 99 }
  - connected_nodes: [main, worker2]
    capabilities: { latency: 10, availability: 99 }
  - connected_nodes: [main, worker3]
    capabilities: { latency: 10, availability: 99 }
  - connected_nodes: [m2, worker1]
    capabilities: { latency: 10, availability: 99 }
  - connected_nodes: [m2, worker2]
    capabilities: { latency: 10, availability: 99 }
  - connected_nodes: [m2, worker3]
    capabilities: { latency: 10, availability: 99 }
  - connected_nodes: [worker1, worker2]
    capabilities: { latency: 10, availability: 99 }
  - connected_nodes: [worker1, worker3]
    capabilities: { latency: 10, availability: 99 }
  - connected_nodes: [worker2, worker3]
    capabilities: { latency: 10, availability: 99 }