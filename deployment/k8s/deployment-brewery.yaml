# Deployment per mongodb-history (flavour: large)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-history
  namespace: brewery 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-history
  template:
    metadata:
      labels:
        app: mongodb-history
    spec:
    
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution: 
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - "master-m03"
      
      containers:
      - name: mongodb-history
        image: docker.io/library/mongo:latest
        imagePullPolicy: IfNotPresent
        
        ports:
        - containerPort: 27017
        resources: 
          requests:
            cpu: "1" 
            memory: "512Mi"
          limits:
            cpu: "1" 
            memory: "512Mi" 
      
        volumeMounts:
        - name: mongodb-history-data
          mountPath: /data/db
      volumes:
      - name: mongodb-history-data
        persistentVolumeClaim:
          claimName: mongodb-history-pvc
---
# Service per mongodb-history
apiVersion: v1
kind: Service
metadata:
  name: mongodb-history
  namespace: brewery 
spec:
  type: ClusterIP
  ports:
  - port: 27017
    targetPort: 27017
  selector:
    app: mongodb-history
---
# PVC per mongodb-history
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-history-pvc
  namespace: brewery 
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi 
---

