# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: brewery
---
# Deployment per gateway (flavour: large)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: brewery 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
    
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution: 
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - "master-m02"
      
      containers:
      - name: gateway
        image: docker.io/library/brewery-gateway:large
        imagePullPolicy: IfNotPresent
        
        ports:
        - containerPort: 5000
        resources: 
          requests:
            cpu: "1" 
            memory: "512Mi"
          limits:
            cpu: "1" 
            memory: "512Mi" 
      
---
# Service per gateway
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: brewery 
spec:
  type: NodePort
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30000
  selector:
    app: gateway
---
