        uses:
          - { component: mongodb-history, min-flavour: standard }
          - { component: data-gather-torino, min-flavour: low }
          - { component: data-gather-olbia, min-flavour: low }
        energy: 0 
      low:
        uses:
          - { component: data-gather-torino, min-flavour: low }
