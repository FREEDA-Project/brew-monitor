        uses:
          - { component: mongodb-history, min-flavour: standard } 
        energy: 0 
    importance_order: [high]

  data-gather-torino:
    flavours:
      high:
        uses:
          - { component: mongodb-batch-torino, min-flavour: standard } 
        energy: 0
      low:
        uses: [] 
        energy: 0 
    importance_order: [low, high]

  data-gather-olbia:
    flavours:
      high:
        uses:
          - { component: mongodb-batch-olbia, min-flavour: standard } 
        energy: 0
      low:
        uses: [] 
        energy: 0 
    importance_order: [low, high]

  mongodb-history: 
    flavours:
      standard:
        uses: []
        energy: 0 
    importance_order: [standard]

  mongodb-batch-olbia: 
    flavours:
      standard:
        uses: []
        energy: 0 
    importance_order: [standard]

