name: case-study-1
components:
  gateway:
    must: true
    flavours:
      high:
        uses:
          - { component: aggregator, min-flavour: high }
          - { component: analyzer, min-flavour: high }
        energy: 0 
      low:
        uses:
          - { component: aggregator, min-flavour: low }
        energy: 0
    importance_order: [low, high] 

  aggregator:
